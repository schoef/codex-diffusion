[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nefqvf"
version = "0.1.0"
description = "Fast evaluation for the six one-dimensional NEF-QVF families"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.60",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.9"]
test = ["pytest>=8.0"]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nefqvf*"]
